name: Checkov IaC Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "charts/**"
      - "clusters/**"
      - "app/Dockerfile"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
      - "charts/**"
      - "clusters/**"
      - "app/Dockerfile"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  checkov:
    name: Check Terraform, Kubernetes, Helm and workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          soft_fail: true
          output_format: cli

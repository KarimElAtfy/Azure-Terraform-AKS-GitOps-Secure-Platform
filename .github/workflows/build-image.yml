name: Build and Push Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/build-image.yml"

permissions:
  contents: write
  id-token: write

env:
  IMAGE_NAME: devsecops-api

jobs:
  build-and-push:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="${{ vars.ACR_LOGIN_SERVER }}/${IMAGE_NAME}"

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update GitOps image tag
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.short_sha }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("clusters/dev/apps/helmrelease.yaml")
          tag = os.environ["IMAGE_TAG"]

          text = path.read_text()

          updated = re.sub(
              r"(?m)^(\s*tag:\s*).*$",
              rf"\g<1>{tag}",
              text,
              count=1,
          )

          updated = re.sub(
              r"(?m)^(\s*gitSha:\s*).*$",
              rf'\g<1>"{tag}"',
              updated,
              count=1,
          )

          if updated == text:
              print("No GitOps tag change produced.")
          else:
              path.write_text(updated)
              print(f"Updated GitOps image tag and gitSha to {tag}.")
          PY

      - name: Commit GitOps image tag update
        shell: bash
        run: |
          if git diff --quiet -- clusters/dev/apps/helmrelease.yaml; then
            echo "No GitOps image tag change to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add clusters/dev/apps/helmrelease.yaml
          git commit -m "chore(gitops): update devsecops-api image tag to ${{ steps.meta.outputs.short_sha }} [skip ci]"
          git push

      - name: Show pushed image references
        run: |
          echo "Pushed:"
          echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}"
          echo "${{ steps.meta.outputs.image }}:latest"

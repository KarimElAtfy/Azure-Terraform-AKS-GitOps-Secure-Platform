name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate app, Docker image and Helm chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Python tests
        run: |
          python -m pytest

      - name: Build Docker image
        run: |
          docker build -t devsecops-api:ci ./app

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: "v3.15.4"

      - name: Lint Helm chart
        run: |
          helm lint ./charts/devsecops-api
          helm lint ./charts/devsecops-api -f ./charts/devsecops-api/values-dev.yaml

      - name: Render Helm chart with dev values
        run: |
          helm template devsecops-api ./charts/devsecops-api \
            -f ./charts/devsecops-api/values-dev.yaml \
            > /tmp/devsecops-api-rendered.yaml

          grep -q "kind: ServiceAccount" /tmp/devsecops-api-rendered.yaml
          grep -q "kind: ConfigMap" /tmp/devsecops-api-rendered.yaml
          grep -q "kind: Service" /tmp/devsecops-api-rendered.yaml
          grep -q "kind: Deployment" /tmp/devsecops-api-rendered.yaml

      - name: Render optional HPA
        run: |
          helm template devsecops-api ./charts/devsecops-api \
            --set autoscaling.enabled=true \
            | grep -q "kind: HorizontalPodAutoscaler"

      - name: Render optional Ingress
        run: |
          helm template devsecops-api ./charts/devsecops-api \
            --set ingress.enabled=true \
            | grep -q "kind: Ingress"

      - name: Render optional Key Vault CSI resources
        run: |
          helm template devsecops-api ./charts/devsecops-api \
            --set keyVault.enabled=true \
            --set keyVault.clientId=dummy-client-id \
            --set keyVault.keyVaultName=dummy-keyvault \
            --set keyVault.tenantId=dummy-tenant-id \
            | grep -q "kind: SecretProviderClass"


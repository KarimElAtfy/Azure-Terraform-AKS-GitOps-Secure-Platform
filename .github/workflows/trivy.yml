name: Trivy Security Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "infra/**"
      - "charts/**"
      - "clusters/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "infra/**"
      - "charts/**"
      - "clusters/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  trivy:
    name: Scan repository for vulnerabilities, secrets and misconfigurations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "0"

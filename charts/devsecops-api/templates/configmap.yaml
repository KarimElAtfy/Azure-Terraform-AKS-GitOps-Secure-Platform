apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devsecops-api.fullname" . }}-config
  labels:
    {{- include "devsecops-api.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.appConfig.appName | quote }}
  ENVIRONMENT: {{ .Values.appConfig.environment | quote }}
  CONFIG_MESSAGE: {{ .Values.appConfig.configMessage | quote }}
  LOG_LEVEL: {{ .Values.appConfig.logLevel | quote }}

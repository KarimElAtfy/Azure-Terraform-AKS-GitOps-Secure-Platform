{{- if .Values.keyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.keyVault.secretProviderClassName }}
  labels:
    {{- include "devsecops-api.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ required "keyVault.clientId is required when keyVault.enabled=true" .Values.keyVault.clientId | quote }}
    keyvaultName: {{ required "keyVault.keyVaultName is required when keyVault.enabled=true" .Values.keyVault.keyVaultName | quote }}
    tenantId: {{ required "keyVault.tenantId is required when keyVault.enabled=true" .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ required "keyVault.secretName is required when keyVault.enabled=true" .Values.keyVault.secretName }}
          objectType: secret
          objectVersion: ""
{{- end }}
